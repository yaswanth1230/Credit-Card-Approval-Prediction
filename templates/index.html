<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Approval</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark">SB</span>
            <span>SmartBridge</span>
        </a>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('predict') }}">Predict</a>
        </nav>
    </header>

    <main class="form-page">
        <section class="form-intro">
            <p class="eyebrow">Applicant Risk Profile</p>
            <h1>Enter Credit Card Applicant Details</h1>
            <p>Fill the form to generate an approval prediction using applicant and credit behavior signals.</p>
        </section>

        <form class="prediction-form" action="{{ url_for('predict') }}" method="post">
            <div class="form-field wide">
                <label for="applicant_name">Applicant Name</label>
                <input id="applicant_name" name="applicant_name" type="text" placeholder="Enter applicant name" required>
            </div>

            <div class="form-field">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option>Female</option>
                    <option>Male</option>
                </select>
            </div>

            <div class="form-field">
                <label for="own_car">Own Car or Not</label>
                <select id="own_car" name="own_car" required>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div class="form-field">
                <label for="own_realty">Own Real Estate</label>
                <select id="own_realty" name="own_realty" required>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div class="form-field">
                <label for="annual_income">Total Annual Income</label>
                <input id="annual_income" name="annual_income" type="number" min="0" value="50000" required>
            </div>

            <div class="form-field">
                <label for="income_type">Type of Income</label>
                <select id="income_type" name="income_type" required>
                    <option>Working</option>
                    <option>Commercial associate</option>
                    <option>Pensioner</option>
                    <option>State servant</option>
                    <option>Student</option>
                </select>
            </div>

            <div class="form-field">
                <label for="education_type">Education</label>
                <select id="education_type" name="education_type" required>
                    <option>Higher education</option>
                    <option>Secondary / secondary special</option>
                    <option>Incomplete higher</option>
                    <option>Lower secondary</option>
                    <option>Academic degree</option>
                </select>
            </div>

            <div class="form-field">
                <label for="family_status">Family Status</label>
                <select id="family_status" name="family_status" required>
                    <option>Married</option>
                    <option>Single / not married</option>
                    <option>Civil marriage</option>
                    <option>Separated</option>
                    <option>Widow</option>
                </select>
            </div>

            <div class="form-field">
                <label for="housing_type">Type of Housing</label>
                <select id="housing_type" name="housing_type" required>
                    <option>House / apartment</option>
                    <option>With parents</option>
                    <option>Municipal apartment</option>
                    <option>Rented apartment</option>
                    <option>Office apartment</option>
                    <option>Co-op apartment</option>
                </select>
            </div>

            <div class="form-field">
                <label for="days_birth">Age</label>
                <input id="days_birth" name="days_birth" type="number" min="18" max="100" value="29" required>
            </div>

            <div class="form-field">
                <label for="days_employed">Employment Years</label>
                <input id="days_employed" name="days_employed" type="number" min="0" max="60" step="0.1" value="2.5" required>
            </div>

            <div class="form-field">
                <label for="family_members">Family Members</label>
                <input id="family_members" name="family_members" type="number" min="1" max="20" value="2" required>
            </div>

            <div class="form-field">
                <label for="emi_paid_off">EMI Paid Off</label>
                <input id="emi_paid_off" name="emi_paid_off" type="number" min="0" value="4" required>
            </div>

            <div class="form-field">
                <label for="emi_past_dues">EMI Past Dues</label>
                <input id="emi_past_dues" name="emi_past_dues" type="number" min="0" value="1" required>
            </div>

            <div class="form-field">
                <label for="number_of_loans">Number of Loans</label>
                <input id="number_of_loans" name="number_of_loans" type="number" min="0" value="2" required>
            </div>

            <div class="score-preview wide">
                <span>Live profile strength</span>
                <div class="meter"><span id="profileMeter"></span></div>
                <strong id="profileScore">Calculating...</strong>
            </div>

            <button class="primary-button wide" type="submit">Predict Approval</button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
